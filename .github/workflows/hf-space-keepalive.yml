name: Keep HF Space Warm

# Free Hugging Face Docker Spaces sleep after ~48h of inactivity and pay a
# 30-90s cold start on the next request. This workflow pings the Space every
# 20 minutes so HF's idle timer never elapses, eliminating cold-starts
# without any paid hardware.
#
# Notes:
# - GitHub Actions cron may be delayed a few minutes during peak load. The
#   20-minute cadence absorbs that comfortably (HF needs 48h, not 20min).
# - GitHub auto-disables scheduled workflows after 60 days of repo
#   inactivity. The manual `workflow_dispatch` trigger lets you re-arm
#   the schedule with one click from the Actions tab.
# - We ping `/health` (cheap, no env spin-up) instead of `/viewer`
#   (heavy HTML).

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

concurrency:
  group: hf-space-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SPACE_URL: https://virustechhacks-parkinsons-motor.hf.space
    steps:
      - name: Wake the Space (retry on cold start)
        run: |
          set -euo pipefail
          url="${SPACE_URL}/health"
          echo "Pinging $url"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" --max-time 90 "$url" || echo "000")
            echo "attempt=$attempt http=$code"
            if [ "$code" = "200" ]; then
              echo "Space is awake."
              cat /tmp/resp.txt
              exit 0
            fi
            sleep 20
          done
          echo "Space did not respond 200 after 6 attempts (last code=$code)."
          cat /tmp/resp.txt || true
          exit 1
