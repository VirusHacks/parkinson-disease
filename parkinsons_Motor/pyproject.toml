[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-parkinsons_Motor"
version = "0.1.0"
description = "Parkinsons Motor environment for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    # Core OpenEnv runtime (provides FastAPI server + HTTP client types)
    # install from github
    # "openenv-core[core] @ git+https://github.com/meta-pytorch/OpenEnv.git",
    "openenv-core[core]>=0.2.2",
    # Environment-specific dependencies
    "numpy>=1.24.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m parkinsons_Motor.server.app
server = "parkinsons_Motor.server.app:main"

[tool.setuptools]
include-package-data = true
packages = [
    "parkinsons_Motor",
    "parkinsons_Motor.server",
    "parkinsons_Motor.tasks",
    "parkinsons_Motor.graders",
    "parkinsons_Motor.core",
    "parkinsons_Motor.evaluation",
    "parkinsons_Motor.tests",
]

[tool.setuptools.package-dir]
"parkinsons_Motor"         = "."
"parkinsons_Motor.server"  = "server"
"parkinsons_Motor.tasks"   = "tasks"
"parkinsons_Motor.graders" = "graders"
"parkinsons_Motor.core"    = "core"
"parkinsons_Motor.evaluation" = "evaluation"
"parkinsons_Motor.tests"   = "tests"
