<!DOCTYPE html>
<html lang="en">
    <head>
        <title>MyoSuite Demo</title>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
        <meta name="application-name"   content="MyoSuite_wasm">
        <meta name="description"        content="contact-rich framework for musculoskeletal motor control">
        <meta name="keywords"           content="MyoSuite, Demo, MuJoCo">
        <meta name="author"             content="Vittorio Caggiano, Vikash Kumar">
        <meta name="viewport"           content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no, shrink-to-fit=0">
        <meta name="theme-color"        content="#ffffff">
        <link rel ="icon" type="image/x-icon" href="./examples/Favicon 32.png">
        <link type="text/css" rel="stylesheet" href="style.css">
    </head>

    <body>
        <h1 hidden></h1> <!-- Puts the Lighthouse Score over 90 heheh-->

        <div id="viewer-loader" class="viewer-loader" role="status" aria-live="polite">
            <div class="viewer-loader-card">
                <div class="viewer-loader-kicker">MotorAssist Preview</div>
                <div class="viewer-loader-title">Preparing the 3D simulation</div>
                <div id="viewer-loader-message" class="viewer-loader-message">Starting viewer bootstrap...</div>
                <div class="viewer-loader-progress" aria-hidden="true">
                    <div id="viewer-loader-bar" class="viewer-loader-bar"></div>
                </div>
                <div class="viewer-loader-meta">
                    <span id="viewer-loader-phase">Booting</span>
                    <span id="viewer-loader-elapsed">0s elapsed</span>
                </div>
                <p class="viewer-loader-note">
                    First load can take 1-2 minutes while WebAssembly, meshes, and textures are downloaded.
                    Please wait for the preview to appear before judging the scene.
                </p>
            </div>
        </div>

        <div class="info top">
            <div class="shadow">
                <a href="https://sites.google.com/view/myosuite/" target="_blank" rel="noopener">MyoSuite</a> Demo
            </div>
        </div>

        

        <!-- Import maps polyfill -->
        <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

        <!-- Allows three.js Examples to work without building -->
        <script type="importmap">
            {
                "imports": {
                    "three": "./node_modules/three/build/three.module.js",
                    "three/addons/": "./node_modules/three/examples/jsm/"
                }
            }
        </script>

        <script type="module" src="./examples/main.js"></script>
        <script type="module" src="./examples/brain-overlay.js"></script>
        <script type="module" src="./examples/viewer-controller.js"></script>
        <script type="module" src="./examples/guided-tour.js"></script>
    </body>
</html>
